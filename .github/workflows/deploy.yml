name: Deploy to GitHub Pages

on:
  push:
    branches: [main, feature/deploy-mock]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tabget-app/package-lock.json
      - name: Install & Build
        env:
          VITE_USE_MOCK: ${{ vars.VITE_USE_MOCK }}
          VITE_API_BASE: ${{ secrets.VITE_API_BASE }}
        run: |
          cd tabget-app
          npm ci
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: tabget-app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
